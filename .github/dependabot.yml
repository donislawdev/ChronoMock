version: 2

# Keeps dependencies current. This is a different question from the one audit.yml asks:
# that workflow runs `cargo deny check advisories` weekly and fails when something we ship
# has a published vulnerability. Dependabot asks whether a newer version exists at all,
# which is how a dependency stops being three years behind without anyone noticing. The two
# overlap only when a stale dependency also turns out to be vulnerable.
#
# Updates are grouped on purpose. This project has one maintainer, and a separate pull
# request per crate is how a dependency bot gets muted - which costs more than the noise it
# was meant to save.

updates:
  # ---- Rust: the workspace at the repository root ------------------------------------
  # One manifest tree, resolved from the root Cargo.toml. Note that the dependency graph
  # here is Windows-only (windows, minhook), so anything Dependabot proposes still has to
  # pass CI on a Windows runner before it means anything.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # A week between a version being published and this bot proposing it. A compromised release
    # is usually found by somebody else within days, and this project has one maintainer, so the
    # cheapest defence available is to let other people meet the version first.
    #
    # Seven rather than nothing, and seven rather than the three days Dependabot has applied by
    # default since 2026-07-14. It costs nothing here: nothing in this workspace is waited on.
    # It does NOT delay a fix for a known vulnerability - security updates ignore the cooldown,
    # and `cargo deny check advisories` in audit.yml asks that question weekly on its own.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---- .NET: the GUI projects --------------------------------------------------------
  # `directories` rather than `directory`, because the packages are declared per project
  # and only three of the five csproj files carry a PackageReference at all. Pointing at
  # /gui alone would find the solution file and none of the manifests under it.
  - package-ecosystem: "nuget"
    directories:
      - "/gui/ChronoMock.App"
      - "/gui/ChronoMock.App.Tests"
      - "/gui/ChronoMock.Protocol.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
    # The same week, for the same reason as the cargo entry above.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---- The workflows themselves ------------------------------------------------------
  # Every action is pinned to a full commit SHA (the reason is at the top of ci.yml), which is
  # precisely the form that never updates on its own - a SHA does not move. Dependabot bumps the
  # SHA and its version comment together, so this is what keeps a pinned action from quietly
  # ageing until it is deprecated and the build stops.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # The same week again, and here it is the point rather than a precaution: a pinned SHA is
    # exactly what an attacker wants moved, and this is the one entry whose whole job is to move
    # SHAs. Only `default-days` - the options reference marks GitHub Actions as supporting that
    # and not the per-SemVer-bump ones, which an action tag does not carry anyway.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
