# The gates this project already runs by hand, run on every push instead.
#
# ONE job, not two, and that is a fact about the repository rather than a CI preference: the C# protocol
# tests resolve the real cargo build outputs (BitnessRouterTests asserts which core a target's bitness
# routes to, against the actual target/<triple>/release/chrono.exe). Split across independent jobs they
# failed with "missing build artifact" - measured on the first run, not foreseen. Passing the binaries
# between jobs as artifacts would work, but a dependent job waits for the same build anyway, so it would
# only add a transfer. The argument is the dependency, not the minutes: it holds whether or not runner
# time is free. If faster feedback is ever wanted, the split worth making is a SECOND job running only the
# checks that need no cargo output (dotnet format), in parallel - not a re-split of these. The one second job
# that exists, the installer's at the bottom, is not a re-split either: it shares nothing with these checks.
#
# What is deliberately NOT here: the environment harness (tools/probes/run-targets.ps1). It injects a DLL
# into live processes and needs JDK, .NET Framework and the hand-built probes - and `tools/` is outside git,
# so it does not exist on a runner at all. It stays a local, pre-release gate.
#
# `cargo fmt --check` is also absent, and on purpose: this codebase is not written to default rustfmt
# (measured 2026-09-04 - 7654 diff lines across every crate), so the check would fail on the first run and
# adopting it means reformatting the whole workspace. That is a decision for the owner, not a CI default.
#
# Every `uses:` is pinned to a full commit SHA, with the release it corresponds to in the comment
# beside it. A tag is a moving pointer: the immutable-release scheme covers the actions/* ones, but
# not a third-party action, and CodeQL flagged exactly that - actions/unpinned-tag on
# Swatinem/rust-cache, in three workflows. It matters most in distribution.yml, which builds the
# archives people download. Dependabot updates the SHA and the version comment together, so pinning
# does not mean freezing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A run superseded by a newer push is cancelled rather than left to finish: the result would be about code
# nobody has any more, and the queue is better spent on the push that replaced it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The tool ships both bitnesses: a 32-bit target needs a 32-bit hook, and building only x64 is how
      # an x86 regression hides for a day (the reason "build both targets" is a standing rule here).
      - name: Add the 32-bit target
        run: rustup target add i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Cheapest gate first: a whitespace slip should not wait out a four-minute Rust build.
      - name: C# format
        run: dotnet format gui/ChronoMock.slnx --verify-no-changes

      # The C# half of the same pinning idea as the clippy step below. The ordinary build already
      # enforces the ceilings in gui/CodeMetricsConfig.txt, because TreatWarningsAsErrors turns a
      # CA1502 or CA1506 finding into an error. This build asks the other question: do those numbers
      # still cost anything. One lower on every rule, and it must FAIL - a pass would mean neither
      # ceiling is actually reached, that both stand above the measurement, and that the next
      # arrival slips in under them in silence.
      #
      # An absolute path on purpose: an AdditionalFiles item resolves against each project's own
      # directory, so a repository-relative path would resolve to nothing and this run would pass
      # for entirely the wrong reason. `--no-incremental` for the same class of reason - a cached
      # compilation would answer with the previous run's thresholds.
      #
      # `$PSNativeCommandUseErrorActionPreference` is turned off for the reason spelled out at the
      # clippy step: GitHub's pwsh shell sets `$ErrorActionPreference = 'stop'`, and where that
      # variable defaults to true a failing native command throws before its exit code can be read,
      # which would invert the meaning of this gate.
      # 🔴 WARNINGS, NOT ERRORS, AND BOTH RULES BY NAME. This step used to ask only whether the
      # tightened build failed, and that question has two holes: one rule with slack hides behind the
      # other, and a rule that fires in the application project stops the build before the test
      # project is compiled at all, so a maximum sitting in a test class is never seen. Measured
      # 2026-09-14: CA1506 stood at 81 with the real maximum at 80, in a test class, and the step was
      # green on CA1502 alone. With warnings left as warnings every project compiles, and the step
      # requires each ceiling to be reached somewhere.
      - name: C# metric ceilings are the measurement, not headroom
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $out = dotnet build gui/ChronoMock.slnx --no-incremental -p:ChronoMetricsConfig=${{ github.workspace }}/.github/metrics-tight/CodeMetricsConfig.txt -p:TreatWarningsAsErrors=false 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host $out
            Write-Host "::error::The tightened build did not compile, so the ceilings could not be measured."
            exit 1
          }
          $reached = [regex]::Matches($out, 'warning (CA150[26])') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          foreach ($rule in 'CA1502', 'CA1506') {
            if ($reached -notcontains $rule) {
              Write-Host "::error::$rule in gui/CodeMetricsConfig.txt has room in it: nothing reaches it one below. Lower it to the real maximum, and .github/metrics-tight/CodeMetricsConfig.txt with it."
              exit 1
            }
          }
          Write-Host "Both ceilings are reached one below: each metric ceiling is a real measurement."
          exit 0

      # -D warnings makes clippy a gate rather than a suggestion. A newer stable Rust can add a lint and
      # turn this red without a code change; that is the intended signal, not a false alarm.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The other half of the shape ceilings, and the half a one-sided ratchet can never give. The
      # step above asks "is the code under the numbers". This one asks "do the numbers still cost
      # anything": same lints, every threshold one lower, and EACH of them must fire somewhere. A
      # ceiling nothing reaches one below stands ABOVE the measurement, granting headroom nobody
      # decided to grant, with the next arrival slipping in under it in silence. That is not
      # hypothetical, it is the failure this pattern was written for in another project: a ceiling
      # stayed twelve lines above its file for a week after a carve-out and was found only because
      # somebody printed the numbers.
      #
      # 🔴 EACH LINT BY NAME, AND WARNINGS LEFT AS WARNINGS. This step used to ask only whether the
      # tightened run failed under -D warnings, and one lint reaching its ceiling answered for all
      # three: the first crate that fails stops every crate that depends on it from being checked, so
      # nesting in chrono-core hid the length and complexity ceilings of chrono-mech and chrono-cli
      # behind a red that looked right. Measured 2026-09-29: after a refactor moved code out, both of
      # those had room (4 and 2) and the step stayed green. Left as warnings, every crate is checked,
      # and the lint codes come from the machine-readable output rather than from message wording a
      # newer clippy may change. The lints asked are the thresholds the tightened file sets, so a
      # ceiling added there is asked here with no second list to keep in step. The same repair the C#
      # step above got on 2026-09-14.
      #
      # Cheap because clippy re-reads its configuration without rebuilding the crates - measured
      # 2026-09-06 on the maintainer's machine, 2.9 s for the run above and 1.7 s for this one.
      #
      # `$PSNativeCommandUseErrorActionPreference` is turned off deliberately. GitHub's pwsh shell
      # sets `$ErrorActionPreference = 'stop'`, and on the PowerShell versions where that variable
      # defaults to true, a failing native command throws before the exit code can be read, and the
      # compile failure this step names would become an unexplained step failure instead.
      - name: Clippy shape ceilings are the measurement, not headroom
        env:
          CLIPPY_CONF_DIR: .github/clippy-tight
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $lints = @(Get-Content .github/clippy-tight/clippy.toml | ForEach-Object { if ($_ -match '^\s*([a-z-]+)-threshold\s*=') { $Matches[1] -replace '-', '_' } })
          if ($lints.Count -eq 0) {
            Write-Host "::error::No threshold was read from .github/clippy-tight/clippy.toml, so there is nothing to measure."
            exit 1
          }
          $lines = @(cargo clippy --workspace --all-targets --message-format=json 2>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          $messages = @($lines | Where-Object { $_.StartsWith('{') } | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-message' } | ForEach-Object { $_.message })
          if ($code -ne 0) {
            $lines | Where-Object { -not $_.StartsWith('{') } | ForEach-Object { Write-Host $_ }
            $messages | Where-Object { $_.level -eq 'error' } | ForEach-Object { Write-Host $_.rendered }
            Write-Host "::error::The tightened clippy run did not compile, so the ceilings could not be measured."
            exit 1
          }
          $reached = @($messages | ForEach-Object { $_.code.code } | Where-Object { $_ } | Sort-Object -Unique)
          $slack = @($lints | Where-Object { $reached -notcontains "clippy::$_" })
          foreach ($lint in $slack) {
            Write-Host "::error::The $lint ceiling in clippy.toml has room in it: nothing reaches it one below. Lower it to the real maximum, and .github/clippy-tight/clippy.toml with it."
          }
          if ($slack.Count -gt 0) { exit 1 }
          Write-Host "Each shape ceiling is reached one below ($($lints -join ', ')): each is a real measurement."
          exit 0

      # 🔴 BEFORE the tests, and not as a convenience. `cargo test` never emits the library this
      # tool injects: a test build compiles `chrono-hook` as a test harness, so `chrono_hook.dll`
      # is never uplifted beside `chrono.exe`, and the one test that drives a real session refuses
      # before it starts anything. On a developer machine that file is present from an earlier
      # `cargo build`, which is why that test passed by hand and failed on every clean runner from
      # the day it was written. Measured on a warm tree: 3,4 s, because this step compiles the
      # dependencies the test step would have compiled anyway and the extra work is one cdylib link.
      - name: Debug artifacts the tests drive
        run: cargo build --workspace

      # The random properties (each in a `mod properties`) draw from one fixed seed on a pull
      # request: a gate answers for the change it was given, and a draw that lands on an old defect
      # elsewhere would turn one pull request red for another's sake. The searching is the weekly
      # run's work (search.yml), with a fresh seed and many more cases. Cases found before are
      # replayed here first, from the proptest-regressions files in the tree.
      - name: Rust tests
        env:
          PROPTEST_RNG_SEED: '20261017'
        run: cargo test --workspace

      # The website, built the way the publishing workflow builds it. --strict turns a dead
      # internal link into a failure here rather than a 404 on a published page - GitHub Pages
      # cannot issue redirects, so a wrong address stays wrong until somebody notices by hand.
      # The debug profile on purpose: the artifact is thrown away, and the crate is already
      # compiled by the test step above, so this costs seconds rather than a rebuild.
      - name: Website
        run: cargo run -p chrono-site -- --strict

      - name: Release build, x64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Release build, x86
        run: cargo build --release --target i686-pc-windows-msvc

      # All four dependency questions in one invocation: licences (untouchable rule 8 - everything we ship
      # must be GPL-3.0 compatible), RustSec advisories, sources and bans. Advisories run here as well as
      # weekly in audit.yml, because the two answer different questions: a push can ADD a vulnerable
      # dependency and should fail on the spot, while the weekly run catches an advisory published
      # against a tree nobody touched. `sources` is the only check that asks WHERE a crate came from -
      # a git dependency would pass the other three and still be code nobody reviewed. `bans` catches a
      # crate we decided against and a wildcard requirement. One invocation, so the binary is fetched once.
      #
      # The published cargo-deny-action is a CONTAINER action, so it only runs on Linux (measured - the
      # first run failed with exactly that). Moving the gate to a Linux runner would be worse than useless:
      # this workspace's dependency tree is Windows-only (windows, minhook), so on Linux cargo would resolve
      # a DIFFERENT, smaller graph and the gate would pass without having checked what we actually ship.
      # So the binary is fetched here instead, pinned by version AND by checksum.
      - name: Dependency gate
        shell: pwsh
        run: ./.github/scripts/cargo-deny.ps1 -Command licenses,advisories,bans,sources

      # After the Rust builds: these resolve the real cargo outputs (see the note at the top).
      # Excluding the Integration trait leaves the hermetic tier - those tests need a live target
      # process or a Chromium install, neither of which a runner has.
      #
      # The spelling changed with xunit v3: the suite runs on Microsoft.Testing.Platform (global.json
      # selects it), where the solution is named by --solution and traits are filtered by
      # --filter-not-trait rather than VSTest's --filter expression. Measured on the same tree: 276
      # tests in total, 268 after this filter, 8 carrying the trait.
      - name: C# tests
        run: dotnet test --solution gui/ChronoMock.slnx --filter-not-trait "Category=Integration"

  # What the Windows installer DOES, asked on a clean Windows machine rather than read off its source.
  # crates/cli/tests/msi.rs holds the lines the installer's behaviour rests on, and a line being there is not
  # the installer working: it has to be installed, upgraded, refused, and removed, and the machine asked after
  # each step (packaging/test-installer.ps1, which says what it asks in its own header).
  #
  # A SECOND job, against the argument at the top of this file, and for the reason that argument gives: that
  # one is about checks that need the cargo outputs of the C# tests, and this job needs neither those tests nor
  # the Gates job's debug builds. It builds the window package itself, by the script a release's first phase
  # runs (packaging/build-dist.ps1, without its gates, which the job above already runs), so what it installs
  # is what a release would carry, minus the signature. Running beside Gates, the installer adds about as
  # much to a pull request's wait as its slower half.
  #
  # The installer is built unsigned here and three times, because the script rebuilds a version under its
  # own number and refuses an older one. WiX is installed by the job and nowhere else, at the one version
  # packaging/build-msi.ps1 builds with: it is a build tool, never a dependency (docs/06-adr.md, ADR-23).
  installer:
    name: The installer installs and leaves
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Add the 32-bit target
        run: rustup target add i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Both cores and the window, packaged the way a release packages them. The gates are skipped on purpose:
      # clippy, the tests and the format check are the Gates job's, and running them twice would only slow
      # the one job that is ever waited for.
      - name: Assemble the window package
        run: ./packaging/build-dist.ps1 -SkipGates

      # The version packaging/build-msi.ps1 refuses to build without, installed where it looks for it.
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "could not install WiX 5.0.2" }

      # Exit 0 only when every question was asked and answered well. Exit 3 (something could not be asked)
      # fails the job as well: a question nobody can ask is not an answer, and a runner that stopped
      # supporting one should be seen on the day it does.
      - name: Install, upgrade, refuse an older one, uninstall
        run: ./packaging/test-installer.ps1 -PackageFolder dist/ChronoMock -WorkFolder "$env:RUNNER_TEMP/installer"

      # The installer's own logs say why a step failed, and nothing else on a runner keeps them.
      - name: Keep the installer logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-logs
          path: ${{ runner.temp }}/installer/logs
          if-no-files-found: warn
