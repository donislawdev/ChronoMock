# The gates this project already runs by hand, run on every push instead.
#
# ONE job, not two, and that is a fact about the repository rather than a CI preference: the C# protocol
# tests resolve the real cargo build outputs (BitnessRouterTests asserts which core a target's bitness
# routes to, against the actual target/<triple>/release/chrono.exe). Split across independent jobs they
# failed with "missing build artifact" - measured on the first run, not foreseen. Passing the binaries
# between jobs as artifacts would work, but a dependent job waits for the same build anyway, so it would
# only add a transfer. The argument is the dependency, not the minutes: it holds whether or not runner
# time is free. If faster feedback is ever wanted, the split worth making is a SECOND job running only the
# checks that need no cargo output (dotnet format), in parallel - not a re-split of these.
#
# What is deliberately NOT here: the environment harness (tools/probes/run-targets.ps1). It injects a DLL
# into live processes and needs JDK, .NET Framework and the hand-built probes - and `tools/` is outside git,
# so it does not exist on a runner at all. It stays a local, pre-release gate.
#
# `cargo fmt --check` is also absent, and on purpose: this codebase is not written to default rustfmt
# (measured 2026-09-04 - 7654 diff lines across every crate), so the check would fail on the first run and
# adopting it means reformatting the whole workspace. That is a decision for the owner, not a CI default.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A run superseded by a newer push is cancelled rather than left to finish: the result would be about code
# nobody has any more, and the queue is better spent on the push that replaced it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The tool ships both bitnesses: a 32-bit target needs a 32-bit hook, and building only x64 is how
      # an x86 regression hides for a day (the reason "build both targets" is a standing rule here).
      - name: Add the 32-bit target
        run: rustup target add i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # Cheapest gate first: a whitespace slip should not wait out a four-minute Rust build.
      - name: C# format
        run: dotnet format gui/ChronoMock.slnx --verify-no-changes

      # -D warnings makes clippy a gate rather than a suggestion. A newer stable Rust can add a lint and
      # turn this red without a code change; that is the intended signal, not a false alarm.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # The website, built the way the publishing workflow builds it. --strict turns a dead
      # internal link into a failure here rather than a 404 on a published page - GitHub Pages
      # cannot issue redirects, so a wrong address stays wrong until somebody notices by hand.
      # The debug profile on purpose: the artifact is thrown away, and the crate is already
      # compiled by the test step above, so this costs seconds rather than a rebuild.
      - name: Website
        run: cargo run -p chrono-site -- --strict

      - name: Release build, x64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Release build, x86
        run: cargo build --release --target i686-pc-windows-msvc

      # Both halves of the dependency gate: licences (untouchable rule 8 - everything we ship must be
      # GPL-3.0 compatible) and RustSec advisories. Advisories run here as well as weekly in audit.yml,
      # because the two answer different questions: a push can ADD a vulnerable dependency and should fail
      # on the spot, while the weekly run catches an advisory published against a tree nobody touched.
      # One invocation, so the binary is fetched once.
      #
      # The published cargo-deny-action is a CONTAINER action, so it only runs on Linux (measured - the
      # first run failed with exactly that). Moving the gate to a Linux runner would be worse than useless:
      # this workspace's dependency tree is Windows-only (windows, minhook), so on Linux cargo would resolve
      # a DIFFERENT, smaller graph and the gate would pass without having checked what we actually ship.
      # So the binary is fetched here instead, pinned by version AND by checksum.
      - name: Dependency gate
        shell: pwsh
        run: ./.github/scripts/cargo-deny.ps1 -Command licenses,advisories

      # After the Rust builds: these resolve the real cargo outputs (see the note at the top).
      # Category!=Integration is the hermetic tier - the excluded tests need a live target process or a
      # Chromium install, neither of which a runner has.
      - name: C# tests
        run: dotnet test gui/ChronoMock.slnx --filter "Category!=Integration"
