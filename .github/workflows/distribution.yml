# Build the portable distribution and hand back the zips.
#
# Manual only. Nothing here runs on a push: a packaged build is something a person WANTS at a moment, not
# an answer to every commit, and each run stores ~70 MB of artifacts that nobody asked for. (A tag trigger
# is the natural addition once versions start moving; the version is still 0.1.0 and is not bumped by the
# assistant, so there is nothing to tag yet.)
#
# The packaging script runs its OWN gates (cargo deny / clippy / test, dotnet test / format) and treats
# every missing piece as a hard stop - a half-assembled distribution that looks complete is worse than a
# clear failure. Those gates are left switched on here rather than skipped, so what gets uploaded is what
# passed. That means cargo-deny has to be on PATH before the script runs.
name: Distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Portable build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Add the 32-bit target
        run: rustup target add i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The script's own gate calls `cargo deny`, so the binary has to be resolvable as a cargo subcommand.
      - name: Put cargo-deny on PATH
        shell: pwsh
        run: ./.github/scripts/cargo-deny.ps1 -InstallOnly

      - name: Assemble the distribution
        shell: pwsh
        run: ./packaging/build-dist.ps1

      # Only the zips: the unpacked folder is the same bytes again, and the GUI one is ~164 MB.
      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrono-mock-portable
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
