# The vulnerability gate, asked on a schedule.
#
# CI runs the same check on every push, and this is not a duplicate of it: the two answer different
# questions. CI catches a push that ADDS a vulnerable dependency. This catches an advisory published
# against a dependency tree nobody has touched - which is the more likely of the two, and which no
# commit-triggered workflow can ever notice, because there is no commit.
name: Dependency audit

on:
  schedule:
    # Mondays, 06:00 UTC. Any weekly slot works; a fixed one makes a missed run obvious.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec advisories
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deny.toml keeps `ignore = []`: an advisory consciously accepted would be listed there with its
      # reason, never waved through silently (rule 6).
      #
      # Windows, and the binary fetched rather than the published action, for the same reason as the licence
      # gate in ci.yml: the action is Linux-only, and on Linux cargo resolves a different (Windows-free)
      # dependency graph, so the answer would be about a tree we do not ship.
      - name: Advisory gate
        shell: pwsh
        run: ./.github/scripts/cargo-deny.ps1 -Command advisories
