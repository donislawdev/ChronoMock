# The vulnerability gates, asked on a schedule.
#
# CI runs the same checks on every push and pull request, and this is not a duplicate of them: the
# two answer different questions. CI catches a change that ADDS a vulnerable dependency. This
# catches an advisory published against a dependency tree nobody has touched - which is the more
# likely of the two, and which no commit-triggered workflow can ever notice, because there is no
# commit.
#
# Two databases, one job each. RustSec through cargo-deny, which reads the graph that ships, and OSV
# through OSV-Scanner, which reads every lock file in the tree and is the one that reports to the
# Security tab. A red run is the notice, and the Security tab is where a finding stays until a
# later run no longer reports it.
name: Dependency audit

on:
  schedule:
    # Mondays, 06:00 UTC. Any weekly slot works, and a fixed one makes a missed run obvious.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec advisories
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deny.toml keeps `ignore = []`: an advisory consciously accepted would be listed there with its
      # reason, never waved through silently (rule 6).
      #
      # Windows, and the binary fetched rather than the published action, for the same reason as the licence
      # gate in ci.yml: the action is Linux-only, and on Linux cargo resolves a different (Windows-free)
      # dependency graph, so the answer would be about a tree we do not ship.
      - name: Advisory gate
        shell: pwsh
        run: ./.github/scripts/cargo-deny.ps1 -Command advisories

  osv:
    name: OSV advisories
    runs-on: ubuntu-latest
    # Writing a report into code scanning is the one permission this needs beyond reading the tree.
    # `actions: read` is what upload-sarif asks for in a private repository, kept as codeql.yml keeps
    # it so the two uploads stay alike.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # The same self-check as the pull request gate in security.yml, before the same verdict.
      - name: The gate checks itself
        run: python -m unittest discover -s .github/scripts -p test_osv_gate.py

      - name: Install the scanner
        run: python .github/scripts/osv_gate.py install "$RUNNER_TEMP/osv"

      # Twice, with the same arguments: JSON for the verdict, which counts what was read, and SARIF
      # for the Security tab. The arguments match the pull request gate in security.yml, so both
      # gates judge the same packages.
      - name: Scan
        run: |
          scan() {
            set +e
            "$RUNNER_TEMP/osv/osv-scanner" scan source --no-resolve --all-packages \
              --format "$1" --output-file "$2" -r ./
            code=$?
            set -e
            echo "osv-scanner ($1) exit code: $code"
            # Zero is clean and one is "found something". Anything above one is the scan failing.
            if [ "$code" -gt 1 ]; then exit "$code"; fi
          }
          scan json "$RUNNER_TEMP/osv.json"
          scan sarif "$RUNNER_TEMP/osv.sarif"

      # Uploaded whatever the verdict says, so a finding reaches the Security tab on the run that
      # found it, and an empty report closes the alerts a fix made obsolete.
      - name: Report to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/osv.sarif
          category: osv-scanner

      - name: Verdict
        run: python .github/scripts/osv_gate.py verdict "$RUNNER_TEMP/osv.json"
