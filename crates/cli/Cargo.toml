[package]
name = "chrono-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

# The friendly driver AND the hidden core mode live in one binary. `chrono run`
# spawns `chrono __core` and talks NDJSON over stdio (ADR-6). The CLI is the
# outermost consumer, so depending on all inner layers is correct.
[[bin]]
name = "chrono"
path = "src/main.rs"

[dependencies]
chrono-core = { workspace = true }
chrono-mech = { workspace = true }
chrono-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Job objects only, for the CDP mechanism: a browser we launched must not outlive the core that
# launched it, and no portable API can express that. Not a new third-party dependency - the same
# crate and version the native layers already use (rule 8), one more feature.
windows = { workspace = true }

# Only for the Rule 16 architecture guard test (reads chrono-core's manifest).
[dev-dependencies]
toml = "1.1"

# Build-time only: embeds the application icon into chrono.exe via the Windows SDK resource
# compiler. Not linked into the shipped binary (like cc), so it needs no third-party notice.
# Rule 8 licence sieve: MIT OR Apache-2.0, verified by `cargo deny check licenses`.
[build-dependencies]
winresource = "0.1"
