# Chrono Mock - product workspace (Stage 1: substitution core).
# Layer crates and dependency direction: see docs/07-architektura-rdzenia.md.
# Rule 16 (core knows nothing of the interface) is enforced by the architecture
# guard test in crates/cli/tests/architecture.rs.
[workspace]
resolver = "2"
members = ["crates/core", "crates/ctl", "crates/mech", "crates/hook", "crates/proto", "crates/cli", "crates/site"]
# The spike lives in tools/ (its own workspace, outside git) - keep it out of ours.
exclude = ["tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
# None of these crates goes to crates.io - the product ships as executables, and the layer crates
# only make sense together. Saying so is not decoration: `cargo deny check bans` refuses to exempt
# a workspace path dependency from the wildcard rule unless the crate is private, because crates.io
# forbids path dependencies in the first place. It also means `cargo publish` cannot go off by
# accident.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minhook = "0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
] }
chrono-core = { path = "crates/core" }
chrono-ctl = { path = "crates/ctl" }
chrono-mech = { path = "crates/mech" }
chrono-proto = { path = "crates/proto" }

# Catch integer overflow in the release build too, not only in dev (RELEASE-008). For a tool whose whole
# job is exact time arithmetic (rules 2, 3), a silent wrap in an unaudited path would produce the WRONG
# TIME instead of a loud failure (against rule 6). The critical paths are already `checked_`; this turns a
# panic on any OTHER overflow into an honest crash rather than a quiet wrong answer.
[profile.release]
overflow-checks = true
# Thin LTO, and the variant matters. Without it the detours call into `chrono-ctl` across a crate
# boundary, and a non-generic function in another rlib cannot be inlined unless the build is LTO'd.
# Measured on the wall-clock hot path (probe `pwall`, GetSystemTimeAsFileTime, 100 M calls per run,
# interleaved A/B on two hook builds because consecutive series measure machine drift and not the
# difference - R2-S3), 12 pairs each, against a hooked call of about 10 ns:
#
#   thin                 -1.40 ns, 12 of 12 pairs faster   build: at or below no-LTO
#   thin + cgu=1         -1.60 ns, 11 of 12                build: 2x on a core touch
#   fat  + cgu=1         -1.10 ns, 12 of 12                build: 3x on a core touch
#
# So thin alone takes the whole win, and the heavier variants buy only size (fat: hook -18% against
# thin's -6%) at 2-3x the build time of every gate run. `#[inline]` on the same helpers was tried
# first and measured as NOTHING (+0.10 ns, 7 of 12) - LTO is what actually lets the call graph fold,
# which is why there are no `#[inline]` attributes to go with this.
#
# The per-package overflow-checks overrides below survive it: cargo emits the flag per crate, so the
# hook and the control block still compile with the checks OFF under LTO (verified on the rustc
# command lines, not assumed - see the note there).
lto = "thin"

# ...except the injected detour call graph. The hook is a cdylib whose detours run inside the target
# process behind an `extern "system"` boundary, and it calls the shared control block (`chrono-ctl`) on the
# hot path. A Rust panic unwinding across that FFI boundary into the target's own code is undefined
# behaviour (there is no `panic = "abort"`), so these two must NEVER panic on overflow. They run on moments
# already validated in range upstream (`moment_to_filetime_utc` is checked, and the session refuses an
# out-of-range moment), so they do not overflow in practice, and their arithmetic stays wrapping/defined.
[profile.release.package.chrono-hook]
overflow-checks = false

[profile.release.package.chrono-ctl]
overflow-checks = false
