# Chrono Mock - product workspace (Stage 1: substitution core).
# Layer crates and dependency direction: see docs/07-architektura-rdzenia.md.
# Rule 16 (core knows nothing of the interface) is enforced by the architecture
# guard test in crates/cli/tests/architecture.rs.
[workspace]
resolver = "2"
members = ["crates/core", "crates/ctl", "crates/mech", "crates/hook", "crates/proto", "crates/cli"]
# The spike lives in tools/ (its own workspace, outside git) - keep it out of ours.
exclude = ["tools"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minhook = "0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
] }
chrono-core = { path = "crates/core" }
chrono-ctl = { path = "crates/ctl" }
chrono-mech = { path = "crates/mech" }
chrono-proto = { path = "crates/proto" }
