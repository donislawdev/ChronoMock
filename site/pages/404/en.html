<!-- The one 404 document for the whole site, in both languages, because GitHub Pages
     serves this same file for a missing address under /pl/ as well. -->

<div class="shell">
  <section style="border-top:0">
    <p class="eyebrow">404</p>
    <h2>That page is not here</h2>
    <p class="sub">
      The address may have been mistyped, or it may be something this site never had.
      Start from the <a href="/">home page</a>.
    </p>

    <p class="sub" lang="pl" style="margin-bottom:0">
      Tej strony tu nie ma. Adres mógł zostać źle przepisany albo nigdy nie istniał.
      Zacznij od <a href="/pl/">strony głównej</a>.
    </p>
  </section>
</div>
